# BENACTA Margin Control: policy register for a connected instance (template).
#
# Copy to data/policies/margin_policy_register.yml and fill with the approved commercial terms of the company.
# Loaded by `benacta load-policies`; the fixture dataset loads its own terms through the same tables.
# Keys are business references: `customer_ref` is the partner reference (`res.partner.ref`), `product_code` the
# internal reference (`product.product.default_code`). Every entry names its owner and source; dates are ISO.
register_version: 1
source_instance: benacta_odoo_online
company_id: 1
owner: Sales finance controller

customer_segments:
  - {customer_ref: C-EXAMPLE, segment: standard, valid_from: "2024-01-01", valid_to: null, source: "Customer master review 2024-01"}

discount_policies:
  - {policy_id: POL-DISC-STANDARD, version: 1, scope: {segment: standard}, max_discount_pct: "5", priority: 10,
     valid_from: "2024-01-01", valid_to: null, source: "Commercial policy 2024, section 3.2"}

discount_derogations:
  - {derogation_id: DEROG-EXAMPLE, order: S00001, max_discount_pct: "15", approved_by_role: finance_approver,
     approved_on: "2026-01-15", valid_from: "2026-01-15", valid_to: "2026-02-15", evidence_ref: "Approval mail 2026-01-15",
     source: "Derogation register"}

freight_contracts:
  - {contract_id: CTR-FREIGHT-EXAMPLE, customer_ref: C-EXAMPLE, terms: rebill, amount: "250", currency: EUR,
     trigger: full_delivery, valid_from: "2024-01-01", valid_to: null, source: "Frame agreement, clause 7"}

contract_prices:
  - {contract_id: CTR-PRICE-EXAMPLE, customer_ref: C-EXAMPLE, product_code: P-EXAMPLE, unit_price: "500", currency: EUR,
     min_quantity: "0", valid_from: "2026-01-01", valid_to: "2026-12-31", source: "Frame agreement, annex A"}

cost_references:
  - {reference_id: REF-COST-2026Q3, product_code: P-EXAMPLE, unit_cost: "300", currency: EUR, frozen_on: "2026-06-30",
     valid_from: "2026-07-01", valid_to: "2026-09-30", source: "Standard cost freeze Q3 2026"}
