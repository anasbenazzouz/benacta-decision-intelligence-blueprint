    persona: Accounts payable controller
    decision: Reverse or confirm
    cadence: daily
    source: vendor bills
    grain: vendor bill
    metrics: [duplicate_candidate_amount]
    deterministic_logic: same supplier, amount and reference within window
    ai_role: none
    evidence: bill pairs
    approval: ap_approver
    action: review task
    outcome_kpi: duplicates prevented
    dependencies: []
    status: Extend
    sprint: later
    acceptance_test: credit note pair not flagged
  - id: UC33
    domain: purchasing
    title: Supplier delays affecting projects
    problem: Late deliveries delay milestones
    persona: Procurement manager
    decision: Expedite or replan
    cadence: weekly
    source: purchase lines, receipts, milestones
    grain: purchase order line
    metrics: [late_receipt_count]
    deterministic_logic: planned date before cutoff without receipt, linked work package milestone
    ai_role: none
    evidence: purchase line, milestone
    approval: procurement manager
    action: expedite task
    outcome_kpi: late receipts
    dependencies: [UC16]
    status: Hold
    sprint: later
    acceptance_test: received line not flagged
  - id: UC34
    domain: purchasing
    title: Stale or inconsistent purchase commitments
    problem: Open commitments no longer reflect the plan
    persona: Project controller
    decision: Close or reforecast commitments
    cadence: monthly
    source: purchase lines, forecast versions
    grain: purchase order line
    metrics: [open_commitments]
    deterministic_logic: open lines without activity beyond age, or above ETC of their work package
    ai_role: none
    evidence: purchase lines, forecast lines
    approval: project controller
    action: closure request
    outcome_kpi: stale commitment value
    dependencies: [UC08]
    status: Extend
    sprint: C
    acceptance_test: ETC below commitments flagged per work package
  - id: UC35
    domain: purchasing
    title: Supplier concentration on critical projects
    problem: Critical projects depend on one supplier
    persona: Procurement manager
    decision: Qualify alternatives
    cadence: quarterly
    source: purchase lines by project
    grain: project, supplier
    metrics: [supplier_share]
    deterministic_logic: share of committed spend by supplier
    ai_role: none
    evidence: purchase lines
    approval: none
    action: sourcing task
    outcome_kpi: concentration index
    dependencies: []
    status: Conference
    sprint: later
    acceptance_test: shares sum to 100 percent
  # ------------------------------------------------------------------ H. Stock and logistics
  - id: UC36
    domain: stock
    title: Dormant stock
    problem: Inventory without movement ties up cash
    persona: Supply chain controller
    decision: Scrap, sell or reallocate
    cadence: monthly
    source: stock moves
    grain: product
    metrics: [dormant_stock_value]
    deterministic_logic: no outgoing move beyond threshold days
    ai_role: none
    evidence: moves
    approval: none
    action: review task
    outcome_kpi: dormant value
    dependencies: []
    status: Hold
    sprint: later
    acceptance_test: threshold boundary tested
  - id: UC37
    domain: stock
    title: Stock-out risk affecting project execution
    problem: Missing components stop site work
    persona: Project manager
    decision: Expedite supply
    cadence: weekly
    source: stock, reservations, plans
    grain: product, project
    metrics: [shortage_quantity]
    deterministic_logic: planned consumption above available and incoming
    ai_role: none
    evidence: stock and plans
    approval: none
    action: purchase request
    outcome_kpi: shortages
    dependencies: []
