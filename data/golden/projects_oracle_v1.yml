# Ground-truth oracle for the project controlling scenarios of dataset demo_v2.
# Written by hand from the scenario definitions in docs/project_controlling_model.md. Never imported by application
# code. Amounts EUR excluding taxes unless the key says ttc (tax-inclusive receivables and cash).
# Conventions: EAC = actual cost to cutoff + ETC (ETC includes open commitments); cost variance = EAC - approved budget
# (positive unfavourable); margin = FRAC - EAC; percentages rounded to 2 decimals for comparison.
