[project]
name = "benacta-api"
version = "0.1.0"
description = "BENACTA Decision System Lab backend: governed finance facts, exceptions, investigation and controlled action on Odoo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pgserver>=0.1.4",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
benacta = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "odoo_live: reads the configured Odoo instance; skipped unless BENACTA_LIVE_ODOO=1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]  # line length is owned by ruff format

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
